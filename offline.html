<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Felykay | Hors ligne</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
    }

    .font-serif {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>

<body class="bg-white h-screen flex flex-col items-center justify-center p-6 text-center">

  <!-- Image de secours -->
  <div class="max-w-md w-full mb-8">
    <img src="/ProjetFelykay/assets/img/Problème de connection_felikay.jpg" alt="Problème de connexion"
      class="w-full h-auto rounded-lg shadow-sm"
      onerror="this.src='https://via.placeholder.com/400x300?text=Felykay+Hors+Ligne'">
  </div>

  <h1 class="font-serif italic text-3xl text-slate-900 mb-4">Oups ! Connexion perdue.</h1>

  <p class="text-slate-500 text-sm max-w-xs mb-8">
    Il semble que vous soyez déconnecté. Vérifiez votre connexion internet pour continuer votre expérience chez Felykay.
  </p>

  <button onclick="window.location.reload()"
    class="px-10 py-4 bg-black text-white text-[10px] uppercase tracking-widest font-bold hover:bg-slate-800 transition-all">
    Réessayer la connexion
  </button>

  <p class="mt-12 text-[9px] uppercase tracking-[0.2em] text-slate-300">© 2026 Felikay</p>

  <script>
    // Détection automatique du retour d'internet
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>

</html>
